<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Structory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">

  <style>
    /* Palette réelle Structory, reprise directement de structory.ai/style.css (fond #0b0b0f,
       cartes #17171c, bordures #2b2b33, texte #f4f4f5, accent ambre #f59e0b) — plus l'ancienne
       palette teal/crème inventée pour Communicator. PreCogn/Navigator gardent leur propre
       identité (terminal noir/vert), volontairement pas touchés ici. */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0b0f;
      color: #f4f4f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #17171c;
      border-bottom: 1px solid #2b2b33;
      padding: 16px 76px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    /* Typo du logo Structory : majuscules, très espacées, géométrique — Orbitron
       s'en approche nettement mieux qu'une police système. */
    .header-title {
      color: #f4f4f5;
      font-family: 'Orbitron', Arial, sans-serif;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      display: inline-block;
      width: fit-content;
    }

    .header-title .accent-o {
      color: #f59e0b;
    }

    .header-subtitle {
      color: #f59e0b;
      font-size: 13px;
      font-weight: 400;
      font-style: italic;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      /* Le plus récent en haut (retour de Stéphane, 2026-08-06) : les nouveaux messages sont
         insérés en TÊTE du DOM (voir addMessage — insertBefore, pas appendChild), pas via
         column-reverse — ce dernier a un comportement de scroll incohérent selon les
         navigateurs, jamais utilisé ici pour cette raison. Ordre DOM = ordre visuel. */
      flex-direction: column;
      gap: 12px;
    }

    .message-ia {
      align-self: flex-start;
      max-width: 80%;
      background: #17171c;
      border-radius: 12px 12px 12px 4px;
      padding: 14px 18px;
      border-left: 4px solid #2b2b33;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease;
      color: #f4f4f5;
    }

    .message-ia .time {
      font-size: 11px;
      color: #8b8b93;
      margin-top: 6px;
    }

    .message-user {
      align-self: flex-end;
      max-width: 80%;
      background: #17171c;
      border-radius: 12px 12px 4px 12px;
      padding: 14px 18px;
      border-right: 4px solid #f59e0b;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease;
      color: #f4f4f5;
    }

    .message-user .time {
      font-size: 11px;
      color: #8b8b93;
      margin-top: 6px;
      text-align: right;
    }

    .message-system {
      align-self: center;
      max-width: 90%;
      background: #17171c;
      border: 1px solid #2b2b33;
      border-radius: 8px;
      padding: 10px 16px;
      color: #d1d5db;
      font-size: 13px;
      text-align: center;
      font-style: italic;
    }

    /* Commandes rapides ledger-cli (balance/journal), 2026-08-11 : retour de Stéphane,
       la compréhension libre est trop aléatoire, il veut de vrais boutons qui déclenchent
       directement les commandes réelles, sans passer par une interprétation devinée. */
    .quick-actions {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      padding: 12px 24px 0;
      background: #0b0b0f;
    }

    .quick-btn {
      background: #17171c;
      border: 1px solid #2b2b33;
      color: #f4f4f5;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .quick-btn:hover {
      border-color: #f59e0b;
      color: #f59e0b;
    }

    .quick-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .input-area {
      flex-shrink: 0;
      display: flex;
      gap: 10px;
      padding: 16px 24px;
      background: #0b0b0f;
      border-top: 1px solid #2b2b33;
    }

    .input-area input {
      flex: 1;
      padding: 12px 16px;
      background: #17171c;
      border: 2px solid #2b2b33;
      border-radius: 8px;
      color: #f4f4f5;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    .input-area input::placeholder {
      color: #8b8b93;
    }

    .input-area input:focus {
      border-color: #f59e0b;
    }

    /* Curseur "_" clignotant qui invite à taper — visible tant que le champ est vide,
       disparaît dès la première frappe (voir #blink-cursor.hidden côté JS). */
    .input-wrapper {
      position: relative;
      flex: 1;
    }

    .input-wrapper input {
      width: 100%;
    }

    #blink-cursor {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #f59e0b;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      pointer-events: none;
      animation: blink 1s step-start infinite;
    }

    .input-wrapper input {
      padding-left: 30px;
    }

    #blink-cursor.hidden {
      display: none;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .input-area button {
      padding: 12px 24px;
      background: #f59e0b;
      color: #0b0b0f;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-area button:hover {
      background: #d97706;
    }

    .input-area button:disabled {
      background: #2b2b33;
      color: #8b8b93;
      cursor: not-allowed;
    }

    .footer {
      flex-shrink: 0;
      padding: 8px 24px;
      background: #0b0b0f;
      font-size: 12px;
      color: #8b8b93;
      text-align: center;
      border-top: 1px solid #2b2b33;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #chat::-webkit-scrollbar {
      width: 6px;
    }

    #chat::-webkit-scrollbar-track {
      background: transparent;
    }

    #chat::-webkit-scrollbar-thumb {
      background: #2b2b33;
      border-radius: 3px;
    }

    #chat::-webkit-scrollbar-thumb:hover {
      background: #3f3f47;
    }

    @media (max-width: 600px) {
      .header {
        padding: 12px 16px;
      }
      .header-title {
        font-size: 17px;
      }
      .header-subtitle {
        font-size: 12px;
      }
      #chat {
        padding: 12px 16px;
      }
      .input-area {
        padding: 12px 16px;
        flex-wrap: wrap;
      }
      .input-area input {
        font-size: 15px;
        padding: 10px 14px;
      }
      .input-area button {
        padding: 10px 18px;
        font-size: 15px;
      }
      .message-ia,
      .message-user {
        max-width: 92%;
      }
    }

    /* Embed dans sidebar Sheets : pas de scrollbar vertical sur la page */
    body.embed { overflow: hidden; }
    html:has(body.embed) { overflow: hidden; }
    body.embed .input-area { order: 3; }
    body.embed .quick-actions { order: 2; }
    body.embed #chat { order: 1; }
  </style>
</head>

<body class="<?= embed ? 'embed' : '' ?>">

  <? if (!embed) { ?>
  <?!= Bibliotheque.getAccountPanelHtml(orgId) ?>

  <div class="header">
    <a class="header-title" href="https://structory.ai" target="_blank" rel="noopener"><?= brandName ?></a>
    <div class="header-subtitle">Raconte-nous ta compta</div>
  </div>

  <? } ?>

  <input type="file" id="file-input" accept=".pdf,.xlsx,.xls,.csv,.docx" style="display:none">
  <div class="quick-actions">
    <button type="button" class="quick-btn" id="quick-balance">📊 Balance</button>
    <button type="button" class="quick-btn" id="quick-journal">📖 Journal</button>
    <button type="button" class="quick-btn" id="quick-accounts">📋 Comptes</button>
  </div>
  <div class="input-area">
    <div class="input-wrapper">
      <span id="blink-cursor">_</span>
      <input type="text" id="input" placeholder="" <?= embed ? '' : 'autofocus' ?>>
    </div>
    <button id="attach" title="Joindre un document (PDF, XLSX, CSV…)">📎</button>
    <button id="send">Envoyer</button>
  </div>
  <div id="file-preview" style="display:none;padding:4px 12px;font-size:11px;color:#f59e0b;background:#17171c;border-top:1px solid #2b2b33;">
    <span id="file-name"></span>
    <span id="file-remove" style="cursor:pointer;margin-left:8px;color:#888;" title="Retirer">✕</span>
  </div>

  <? if (!embed) { ?>
  <div id="chat">
    <div class="message-ia">
      Bonjour ! 👋<br>
      Je suis <strong>IAstructory</strong>.<br>
      Raconte-moi ta compta en français, je m'occupe du reste.<br><br>
      💡 <em>Exemple : "j'ai payé 45€ au restaurant"</em>
      <div class="time">IAstructory · maintenant</div>
    </div>
  </div>
  <? } else { ?>
  <div id="chat"></div>
  <? } ?>

  <? if (!embed) { ?>
  <div class="footer">
    Structory · La comptabilité qui se raconte
  </div>
  <? } ?>

  <script>
    const ORG_ID = "<?= orgId ?>";
    const IS_EMBED = <?= embed ? 'true' : 'false' ?>;
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const blinkCursor = document.getElementById('blink-cursor');

    // Reste visible tant que le champ est vide (même avec le focus autofocus) — c'est une
    // invitation à taper, pas un indicateur de focus ; disparaît dès la première frappe.
    function updateBlinkCursor() {
      blinkCursor.classList.toggle('hidden', input.value.length > 0);
    }
    input.addEventListener('input', updateBlinkCursor);

    let isProcessing = false;

    // Redimensionnement dynamique du parent (2026-07-26, retour de Stéphane : "la fenêtre de
    // discussion doit être adaptée au volume") — voir Navigator/Code.js pour le récepteur
    // (listener 'message', id="communicator-iframe"). #chat est en flex:1 dans un body
    // height:100vh, donc il remplit toujours toute la hauteur donnée par l'iframe même vide —
    // une hauteur d'iframe fixe ne peut jamais être juste dans les deux cas. Sans effet si
    // Communicator n'est pas dans un iframe.
    function reportHeightToParent() {
      const inputArea = document.querySelector('.input-area');
      const h = (inputArea ? inputArea.offsetHeight : 60) + chat.scrollHeight + 8;
      try {
        window.parent.postMessage({ type: 'communicator-height', height: h }, '*');
      } catch (e) { /* pas dans un iframe, ou parent inaccessible : sans conséquence */ }
    }

    function addMessage(content, type, time = null) {
      const div = document.createElement('div');
      div.className = `message-${type}`;
      const text = content.replace(/\n/g, '<br>');
      // Pas de session utilisateur ici (visiteur anonyme, executeAs=USER_DEPLOYING) donc pas de
      // vrai fuseau horaire connu — UTC explicite plutôt que de deviner celui du navigateur/
      // appareil (retour de Stéphane 2026-08-13 : affichait le fuseau Martinique par défaut).
      const timeStr = time || new Date().toLocaleTimeString('fr', { hour: '2-digit', minute: '2-digit', timeZone: 'UTC' });
      div.innerHTML = `${text}<div class="time">${timeStr}</div>`;
      // insertBefore (pas appendChild) : le nouveau message devient le premier enfant, donc le
      // premier visible en haut — aucune gestion de scroll nécessaire, contrairement à
      // column-reverse (retiré, comportement de scroll trop incohérent selon les navigateurs).
      chat.insertBefore(div, chat.firstChild);
      chat.scrollTop = 0;
      reportHeightToParent();
    }
    
    // ── Pièce jointe (Docling via Analyzor) ──────────────────────────────
    const fileInput    = document.getElementById('file-input');
    const attachBtn    = document.getElementById('attach');
    const filePreview  = document.getElementById('file-preview');
    const fileNameSpan = document.getElementById('file-name');
    const fileRemove   = document.getElementById('file-remove');
    let pendingFile    = null;  // {name, base64}

    attachBtn.addEventListener('click', function() { fileInput.click(); });

    fileInput.addEventListener('change', function() {
      const f = fileInput.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const b64 = e.target.result.split(',')[1];  // strip data:...;base64,
        pendingFile = { name: f.name, base64: b64 };
        fileNameSpan.textContent = '📎 ' + f.name;
        filePreview.style.display = 'block';
      };
      reader.readAsDataURL(f);
      fileInput.value = '';
    });

    fileRemove.addEventListener('click', function() {
      pendingFile = null;
      filePreview.style.display = 'none';
    });

    function sendMessage() {
      const text = input.value.trim();
      if ((!text && !pendingFile) || isProcessing) return;

      const displayText = text || ('📎 ' + (pendingFile ? pendingFile.name : ''));
      input.value = '';
      updateBlinkCursor();
      isProcessing = true;
      sendBtn.disabled = true;
      sendBtn.textContent = '...';

      addMessage(displayText, 'user');
      filePreview.style.display = 'none';

      // Sur mobile/tablette, un input.focus() appelé APRÈS une réponse réseau asynchrone
      // (dans withSuccessHandler) n'est plus considéré comme déclenché par un geste utilisateur
      // par le navigateur — le clavier virtuel ne se rouvre alors jamais tout seul, forçant à
      // retaper manuellement dans le champ (retour de Stéphane, 2026-08-06). Le focus doit être
      // repris tout de suite, ici, dans le même tap qui a lancé l'envoi — pas après coup.
      input.focus();

      const file = pendingFile;
      pendingFile = null;

      function onSuccess(result) {
        addMessage(result, 'ia');
        isProcessing = false;
        sendBtn.disabled = false;
        sendBtn.textContent = 'Envoyer';
      }
      function onError(error) {
        addMessage('❌ Erreur: ' + error.message, 'system');
        isProcessing = false;
        sendBtn.disabled = false;
        sendBtn.textContent = 'Envoyer';
      }

      if (file) {
        google.script.run
          .withSuccessHandler(onSuccess)
          .withFailureHandler(onError)
          .communicateWithDocument(text, ORG_ID, file.name, file.base64);
      } else {
        google.script.run
          .withSuccessHandler(onSuccess)
          .withFailureHandler(onError)
          .communicate(text, ORG_ID);
      }
    }

    // Sur tablette, taper "Envoyer" pendant que le clavier virtuel est ouvert peut faire perdre
    // le focus du champ (le clavier se ferme, la mise en page bouge sous le doigt) — le
    // navigateur annule alors ce premier tap comme un défilement plutôt qu'un clic, d'où
    // "il faut taper deux fois" (retour de Stéphane, 2026-08-06). Fix : empêcher le bouton de
    // voler le focus (preventDefault sur mousedown/touchstart, qui arrivent AVANT ce
    // basculement), et déclencher l'envoi dès ce premier événement plutôt que d'attendre le
    // "click" qui arrive après coup, une fois la mise en page déjà perturbée.
    // touchstart/mousedown ET click restent TOUS actifs (le garde-fou sendTriggered évite
    // qu'un même tap déclenche un envoi en double) — un seul chemin qui échoue silencieusement
    // selon le navigateur/webview aurait pu laisser le bouton totalement inerte.
    let sendTriggered = false;
    function triggerSend() {
      if (sendTriggered) return;
      sendTriggered = true;
      setTimeout(function () { sendTriggered = false; }, 400);
      sendMessage();
    }
    sendBtn.addEventListener('touchstart', triggerSend, { passive: true });
    sendBtn.addEventListener('mousedown', triggerSend);
    sendBtn.addEventListener('click', triggerSend);

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') sendMessage();
    });

    // ── Commandes rapides ledger-cli (balance/journal) ───────────────────
    var quickBtns = [
      document.getElementById('quick-balance'),
      document.getElementById('quick-journal'),
      document.getElementById('quick-accounts')
    ];
    function setQuickBtnsDisabled(disabled) {
      quickBtns.forEach(function (b) { b.disabled = disabled; });
      sendBtn.disabled = disabled;
    }
    function runQuickCommand(fnName, label) {
      if (isProcessing) return;
      isProcessing = true;
      setQuickBtnsDisabled(true);
      addMessage(label, 'user');
      google.script.run
        .withSuccessHandler(function (result) {
          addMessage(result, 'ia');
          isProcessing = false;
          setQuickBtnsDisabled(false);
        })
        .withFailureHandler(function (error) {
          addMessage('❌ Erreur: ' + error.message, 'system');
          isProcessing = false;
          setQuickBtnsDisabled(false);
        })[fnName](ORG_ID);
    }
    document.getElementById('quick-balance').addEventListener('click', function () { runQuickCommand('quickBalance', '📊 Balance'); });
    document.getElementById('quick-journal').addEventListener('click', function () { runQuickCommand('quickJournal', '📖 Journal'); });
    document.getElementById('quick-accounts').addEventListener('click', function () { runQuickCommand('quickAccounts', '📋 Comptes'); });

    // En embed (colonne Navigator), ce focus au chargement de la page faisait défiler la page
    // PARENTE jusqu'à l'iframe Communicator sur mobile/tablette (le navigateur amène tout champ
    // qui reçoit le focus dans le viewport, même à travers un iframe) — l'utilisateur "atterrissait"
    // en bas de Navigator sans avoir rien demandé (retour de Stéphane, 2026-08-06). Jamais en embed ;
    // toujours en usage autonome (comportement voulu, inchangé).
    if (!IS_EMBED) setTimeout(() => input.focus(), 100);
    reportHeightToParent();

  </script>
  
</body>
</html>
