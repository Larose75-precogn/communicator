<body>

  <?!= Bibliotheque.getAccountPanelHtml(orgId) ?>

  <div class="header">
    <div class="header-title">
      <span>📘</span> Structory
    </div>
    <div class="header-subtitle">Raconte-nous ta compta</div>
  </div>
  
  <div id="chat">
    <div class="message-ia">
      Bonjour ! 👋<br>
      Je suis <strong>IAstructory</strong>.<br>
      Raconte-moi ta compta en français, je m'occupe du reste.<br><br>
      💡 <em>Exemple : "j'ai payé 45€ au restaurant"</em>
      <div class="time">IAstructory · maintenant</div>
    </div>
  </div>
  
  <div class="input-area">
    <input type="text" id="input" placeholder="Écris ta compta..." autofocus>
    <button id="send">Envoyer</button>
  </div>
  
  <div class="footer">
    Structory · La comptabilité qui se raconte
  </div>
  
  <script>
    const ORG_ID = "<?= orgId ?>";
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    let isProcessing = false;
    
    function addMessage(content, type, time = null) {
      const div = document.createElement('div');
      div.className = `message-${type}`;
      const text = content.replace(/\n/g, '<br>');
      const timeStr = time || new Date().toLocaleTimeString('fr', { hour: '2-digit', minute: '2-digit' });
      div.innerHTML = `${text}<div class="time">${timeStr}</div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
    
    function sendMessage() {
      const text = input.value.trim();
      if (!text || isProcessing) return;
      
      input.value = '';
      isProcessing = true;
      sendBtn.disabled = true;
      sendBtn.textContent = '...';
      
      addMessage(text, 'user');
      
      google.script.run
        .withSuccessHandler(function(result) {
          addMessage(result, 'ia');
          isProcessing = false;
          sendBtn.disabled = false;
          sendBtn.textContent = 'Envoyer';
          input.focus();
        })
        .withFailureHandler(function(error) {
          addMessage(`❌ Erreur: ${error.message}`, 'system');
          isProcessing = false;
          sendBtn.disabled = false;
          sendBtn.textContent = 'Envoyer';
          input.focus();
        })
        .communicate(text, ORG_ID);
    }
    
    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') sendMessage();
    });
    
    setTimeout(() => input.focus(), 100);
  </script>
  
</body>
